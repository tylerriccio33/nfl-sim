<div class="space-y-2 p-2">
    {% for game in games %}
    <div
        class="game-card bg-gray-700 rounded-lg p-3 cursor-pointer hover:bg-gray-600 transition-colors"
        hx-post="/simulate/{{ game.home_team }}/{{ game.away_team }}"
        hx-target="#main-panel"
        hx-swap="innerHTML"
        hx-indicator="#loading-{{ game.home_team }}-{{ game.away_team }}">

        <div class="flex justify-between items-center">
            <div>
                <span class="font-bold text-white">{{ game.away_team }}</span>
                <span class="text-gray-400 mx-1">@</span>
                <span class="font-bold text-green-400">{{ game.home_team }}</span>
            </div>
            <span id="loading-{{ game.home_team }}-{{ game.away_team }}"
                  class="htmx-indicator text-blue-400">
                <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                </svg>
            </span>
        </div>
        {% if game.gameday %}
        <div class="text-xs text-gray-400 mt-1">{{ game.gameday }}</div>
        {% endif %}
    </div>
    {% else %}
    <div class="text-gray-500 text-center p-4">
        <p>No games scheduled</p>
        <p class="text-xs mt-1">Try refreshing or check back later</p>
    </div>
    {% endfor %}
</div>
