# ── Intents ───────────────────────────────────────────────────────────
[intents.RUN]
value = 1
route = "RUN"

[intents.DROPBACK]
value = 2
route = "DROPBACK"

[intents.FIELD_GOAL]
value = 3
route = "ST"

[intents.PUNT]
value = 4
route = "ST"

# ── PBP play_type → Intent mapping (training data extraction) ────
[play_type_map]
run = "RUN"
pass = "DROPBACK"
qb_kneel = "RUN"
punt = "PUNT"
field_goal = "FIELD_GOAL"

# ── Tokens ────────────────────────────────────────────────────────────
# Each token encodes a play type + outcome bucket. The XGB model predicts
# a token, which is then parsed into Intent + Outcome.

[tokens.RUN_NEG]
intent = "RUN"
yards = [-15, -1]
turnover = "NONE"
complete_pass = false
pass_attempt = false
rush_attempt = true

[tokens.RUN_0_5]
intent = "RUN"
yards = [0, 5]
turnover = "NONE"
complete_pass = false
pass_attempt = false
rush_attempt = true

[tokens.RUN_5_10]
intent = "RUN"
yards = [5, 10]
turnover = "NONE"
complete_pass = false
pass_attempt = false
rush_attempt = true

[tokens.RUN_10_20]
intent = "RUN"
yards = [10, 20]
turnover = "NONE"
complete_pass = false
pass_attempt = false
rush_attempt = true

[tokens.RUN_20P]
intent = "RUN"
yards = [20, 80]
turnover = "NONE"
complete_pass = false
pass_attempt = false
rush_attempt = true

[tokens.CP_0_5]
intent = "DROPBACK"
yards = [0, 5]
turnover = "NONE"
complete_pass = true
pass_attempt = true
rush_attempt = false

[tokens.CP_5_10]
intent = "DROPBACK"
yards = [5, 10]
turnover = "NONE"
complete_pass = true
pass_attempt = true
rush_attempt = false

[tokens.CP_10_20]
intent = "DROPBACK"
yards = [10, 20]
turnover = "NONE"
complete_pass = true
pass_attempt = true
rush_attempt = false

[tokens.CP_20P]
intent = "DROPBACK"
yards = [20, 80]
turnover = "NONE"
complete_pass = true
pass_attempt = true
rush_attempt = false

[tokens.IC]
intent = "DROPBACK"
yards = [0, 0]
turnover = "NONE"
complete_pass = false
pass_attempt = true
rush_attempt = false

[tokens.SACK]
intent = "DROPBACK"
yards = [-15, -1]
turnover = "NONE"
complete_pass = false
pass_attempt = true
rush_attempt = false

[tokens.RUN_FUM]
intent = "RUN"
yards = [-5, 5]
turnover = "FUMBLE"
complete_pass = false
pass_attempt = false
rush_attempt = true

[tokens.PASS_FUM]
intent = "DROPBACK"
yards = [-5, 5]
turnover = "FUMBLE"
complete_pass = false
pass_attempt = true
rush_attempt = false

[tokens.PASS_INT]
intent = "DROPBACK"
yards = [-5, 20]
turnover = "INTERCEPTION"
complete_pass = false
pass_attempt = true
rush_attempt = false

# FG/PUNT are predicted by the single token classifier like any other token —
# there is no dedicated FG math or punt regressor. Their yards are realized from
# the uniform [lo, hi] fallback (they are excluded from the play pool), and that
# value drives apply_outcome directly:
#   * PUNT: yards_gained *is* the punt distance → field flip.
#   * FG:   made iff yardline_100 - yards_gained <= 0, so a uniform draw over
#           [50, 60] makes ~always inside the ~50 yardline and falls off for long
#           attempts. Tune against parity.
[tokens.PUNT]
intent = "PUNT"
yards = [40, 50]
turnover = "NONE"
complete_pass = false
pass_attempt = false
rush_attempt = false

[tokens.FG]
intent = "FIELD_GOAL"
yards = [50, 60]
turnover = "NONE"
complete_pass = false
pass_attempt = false
rush_attempt = false

# ── Play pool ──────────────────────────────────────────────────────────
# The token classifier decides *which* token a play is; the concrete field
# values are realized by sampling a real historical play of that token (scoped
# to the offense team). `fields` is the ordered set of columns pulled off that
# one sampled play. Crucially, all fields come from the *same* sampled row, so
# they stay mutually coherent (e.g. yards and — eventually — time/receiver are
# from one real snap, never independently drawn).
#
# Adding a field here makes it materialize, travel, and surface automatically.
# Type is inferred from the pbp dtype (int → numeric lane, str → string lane);
# dest is inferred — `yards_gained` realizes the token's yards (outcome), every
# other field is a passthrough column emitted on the trace for downstream use.
[play_pool]
fields = ["yards_gained", "passer_player_id"]

# ── Models ───────────────────────────────────────────────────────────

# The single token classifier: predicts a token directly over *all* tokens
# (RUN_*, CP_*, IC, SACK, *_FUM, PASS_INT, FG, PUNT). The token fully encodes
# intent + outcome bucket, so there is no separate intent stage or per-intent
# expert. Features are the union of what the old intent/run/dropback models used.
[models.token]
artifact = "training/artifacts/token"
raw = "model.json"
features = [
    "down",
    "ydstogo",
    "yardline_100",
    "score_diff",
    "qtr",
    "clock",
    "goal_to_go",
    "spread_line",
    "season_epa",
    "dropback_rate",
    "int_rate",
]
outcomes = ["token"]

[models.time]
artifact = "training/artifacts/time"
raw = "model.json"
features = ["yards_gained", "complete_pass", "pass_attempt", "rush_attempt"]
outcomes = ["time_elapsed"]

# ── XGB Hyperparameters ───────────────────────────────────────────────
[xgb]
n_estimators = 200
max_depth = 6
learning_rate = 0.1
random_state = 42

# ── Feature Registry ──────────────────────────────────────────────────
# source: "online" = pre-materialized parquet, "state" = _GameState index,
#         "odt" = on-demand transform from live state/trace, "outcome" = Outcome field

[features.down]
source = "state"
index = 4

[features.ydstogo]
source = "state"
index = 5

[features.yardline_100]
source = "state"
index = 6

[features.qtr]
source = "state"
index = 0

[features.clock]
source = "state"
index = 1

[features.spread_line]
source = "online"

[features.season_epa]
source = "online"

[features.dropback_rate]
source = "online"

[features.int_rate]
source = "online"

[features.score_diff]
source = "odt"

[features.goal_to_go]
source = "odt"

[features.yards_gained]
source = "outcome"

[features.complete_pass]
source = "outcome"

[features.pass_attempt]
source = "outcome"

[features.rush_attempt]
source = "outcome"

# ── Outcome ──────────────────────────────────────────────────────────

[outcome.yards_gained]
type = "int"

[outcome.turnover_type]
type = "TurnoverType"

[outcome.touchdown]
type = "bool"

[outcome.time_elapsed]
type = "int"

[outcome.complete_pass]
type = "bool"
default = false

[outcome.pass_attempt]
type = "bool"
default = false

[outcome.rush_attempt]
type = "bool"
default = false

# ── Training Data ─────────────────────────────────────────────────────
[training]
pbp_path = "data/pbp.parquet"
schedule_path = "data/schedules.parquet"
eval_split = 0.1
quarters = [1, 2, 3, 4]
