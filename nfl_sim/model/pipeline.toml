# ── Intents ───────────────────────────────────────────────────────────
[intents.RUN]
value = 1
route = "RUN"

[intents.PASS]
value = 2
route = "PASS"

[intents.FIELD_GOAL]
value = 3
route = "ST"

[intents.PUNT]
value = 4
route = "ST"

# ── PBP play_type → Intent mapping (training data extraction) ────
[play_type_map]
run = "RUN"
pass = "PASS"
qb_kneel = "RUN"
punt = "PUNT"
field_goal = "FIELD_GOAL"

# ── Tokens ────────────────────────────────────────────────────────────
# Each token encodes a play type + outcome bucket. The XGB model predicts
# a token, which is then parsed into Intent + Outcome.

[tokens.RUN_NEG]
intent = "RUN"
yards = [-15, -1]
turnover = "NONE"
complete_pass = false
pass_attempt = false
rush_attempt = true

[tokens.RUN_0_5]
intent = "RUN"
yards = [0, 5]
turnover = "NONE"
complete_pass = false
pass_attempt = false
rush_attempt = true

[tokens.RUN_5_10]
intent = "RUN"
yards = [5, 10]
turnover = "NONE"
complete_pass = false
pass_attempt = false
rush_attempt = true

[tokens.RUN_10_20]
intent = "RUN"
yards = [10, 20]
turnover = "NONE"
complete_pass = false
pass_attempt = false
rush_attempt = true

[tokens.RUN_20P]
intent = "RUN"
yards = [20, 80]
turnover = "NONE"
complete_pass = false
pass_attempt = false
rush_attempt = true

[tokens.CP_0_5]
intent = "PASS"
yards = [0, 5]
turnover = "NONE"
complete_pass = true
pass_attempt = true
rush_attempt = false

[tokens.CP_5_10]
intent = "PASS"
yards = [5, 10]
turnover = "NONE"
complete_pass = true
pass_attempt = true
rush_attempt = false

[tokens.CP_10_20]
intent = "PASS"
yards = [10, 20]
turnover = "NONE"
complete_pass = true
pass_attempt = true
rush_attempt = false

[tokens.CP_20P]
intent = "PASS"
yards = [20, 80]
turnover = "NONE"
complete_pass = true
pass_attempt = true
rush_attempt = false

[tokens.IC]
intent = "PASS"
yards = [0, 0]
turnover = "NONE"
complete_pass = false
pass_attempt = true
rush_attempt = false

[tokens.SACK]
intent = "PASS"
yards = [-15, -1]
turnover = "NONE"
complete_pass = false
pass_attempt = true
rush_attempt = false

[tokens.RUN_FUM]
intent = "RUN"
yards = [-5, 5]
turnover = "FUMBLE"
complete_pass = false
pass_attempt = false
rush_attempt = true

[tokens.PASS_FUM]
intent = "PASS"
yards = [-5, 5]
turnover = "FUMBLE"
complete_pass = false
pass_attempt = true
rush_attempt = false

[tokens.PASS_INT]
intent = "PASS"
yards = [-5, 20]
turnover = "INTERCEPTION"
complete_pass = false
pass_attempt = true
rush_attempt = false

[tokens.PUNT]
intent = "PUNT"
yards = [0, 0]
turnover = "NONE"
complete_pass = false
pass_attempt = false
rush_attempt = false

[tokens.FG]
intent = "FIELD_GOAL"
yards = [0, 0]
turnover = "NONE"
complete_pass = false
pass_attempt = false
rush_attempt = false

# ── Models ───────────────────────────────────────────────────────────

[models.xgb]
artifact = "training/artifacts/xgb"
raw = "model.json"
features = [
    "down",
    "ydstogo",
    "yardline_100",
    "score_diff",
    "qtr",
    "clock",
    "goal_to_go",
    "spread_line",
    "season_epa",
]
outcomes = ["token"]

[models.punt]
artifact = "training/artifacts/punt"
raw = "model.json"
features = ["yardline_100"]
outcomes = ["kick_distance"]

[models.time]
artifact = "training/artifacts/time"
raw = "model.json"
features = ["yards_gained", "complete_pass", "pass_attempt", "rush_attempt"]
outcomes = ["time_elapsed"]

# ST plays use a fixed time override (no model needed)
[st.time_override]
value = 20

# ── XGB Hyperparameters ───────────────────────────────────────────────
[xgb]
n_estimators = 200
max_depth = 6
learning_rate = 0.1
random_state = 42

# ── Feature Registry ──────────────────────────────────────────────────
# source: "online" = pre-materialized parquet, "state" = _GameState index,
#         "odt" = on-demand transform from live state/trace, "outcome" = Outcome field

[features.down]
source = "state"
index = 4

[features.ydstogo]
source = "state"
index = 5

[features.yardline_100]
source = "state"
index = 6

[features.qtr]
source = "state"
index = 0

[features.clock]
source = "state"
index = 1

[features.spread_line]
source = "online"

[features.season_epa]
source = "online"

[features.score_diff]
source = "odt"

[features.goal_to_go]
source = "odt"

[features.yards_gained]
source = "outcome"

[features.complete_pass]
source = "outcome"

[features.pass_attempt]
source = "outcome"

[features.rush_attempt]
source = "outcome"

# ── Outcome ──────────────────────────────────────────────────────────

[outcome.yards_gained]
type = "int"

[outcome.turnover_type]
type = "TurnoverType"

[outcome.touchdown]
type = "bool"

[outcome.time_elapsed]
type = "int"

[outcome.complete_pass]
type = "bool"
default = false

[outcome.pass_attempt]
type = "bool"
default = false

[outcome.rush_attempt]
type = "bool"
default = false

# ── Training Data ─────────────────────────────────────────────────────
[training]
pbp_path = "data/pbp.parquet"
schedule_path = "data/schedules.parquet"
eval_split = 0.1
quarters = [1, 2, 3, 4]
