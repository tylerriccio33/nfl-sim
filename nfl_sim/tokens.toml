# Token taxonomy for the play outcome classifier.
#
# Each token maps to an action, a yard-sampling range, and a turnover type.
# For DROPBACK completions, yards = air_yards + yac (both sampled independently).
#
# Fields:
#   action     - RUN | PASS | FIELD_GOAL | PUNT (maps to Action enum)
#   yards_lo   - lower bound of uniform yard sampling
#   yards_hi   - upper bound of uniform yard sampling
#   turnover   - NONE | INTERCEPTION | FUMBLE
#   ay_lo/ay_hi/yac_lo/yac_hi - for pass completions (yards = ay + yac)

# ── RUN (6) ──────────────────────────────────────────────────────────────

[RUN_LOSS]
action = "RUN"
yards_lo = -10
yards_hi = -1
turnover = "NONE"

[RUN_SHORT]
action = "RUN"
yards_lo = 0
yards_hi = 3
turnover = "NONE"

[RUN_MED]
action = "RUN"
yards_lo = 4
yards_hi = 7
turnover = "NONE"

[RUN_SHORT_FUM]
action = "RUN"
yards_lo = -2
yards_hi = 4
turnover = "FUMBLE"

[RUN_LONG]
action = "RUN"
yards_lo = 8
yards_hi = 15
turnover = "NONE"

[RUN_EXPLOSIVE]
action = "RUN"
yards_lo = 16
yards_hi = 40
turnover = "NONE"

# ── SACK (2) ─────────────────────────────────────────────────────────────

[SACK]
action = "PASS"
yards_lo = -12
yards_hi = -1
turnover = "NONE"

[SACK_FUM]
action = "PASS"
yards_lo = -12
yards_hi = -1
turnover = "FUMBLE"

# ── DROPBACK incomplete / turnover (3) ───────────────────────────────────

[DROPBACK_INC]
action = "PASS"
yards_lo = 0
yards_hi = 0
turnover = "NONE"

[DROPBACK_INT]
action = "PASS"
yards_lo = 0
yards_hi = 0
turnover = "INTERCEPTION"

[DROPBACK_FUM]
action = "PASS"
yards_lo = -5
yards_hi = 5
turnover = "FUMBLE"

# ── SCREEN completions (3) ───────────────────────────────────────────────
# air_yards <= 0, complete_pass=1, not sack

[SCREEN_YAC0_5]
action = "PASS"
yards_lo = 0
yards_hi = 5
turnover = "NONE"

[SCREEN_YAC6_10]
action = "PASS"
yards_lo = 6
yards_hi = 10
turnover = "NONE"

[SCREEN_YAC11P]
action = "PASS"
yards_lo = 11
yards_hi = 25
turnover = "NONE"

# ── DROPBACK completions (7) ─────────────────────────────────────────────
# air_yards > 0, complete_pass=1
# yards = air_yards + yac (both sampled from their bucket ranges)

[DROPBACK_AY1_10_YAC0]
action = "PASS"
ay_lo = 1
ay_hi = 10
yac_lo = 0
yac_hi = 0
turnover = "NONE"

[DROPBACK_AY1_10_YAC1_10]
action = "PASS"
ay_lo = 1
ay_hi = 10
yac_lo = 1
yac_hi = 10
turnover = "NONE"

[DROPBACK_AY1_10_YAC11P]
action = "PASS"
ay_lo = 1
ay_hi = 10
yac_lo = 11
yac_hi = 25
turnover = "NONE"

[DROPBACK_AY11_20_YAC0_5]
action = "PASS"
ay_lo = 11
ay_hi = 20
yac_lo = 0
yac_hi = 5
turnover = "NONE"

[DROPBACK_AY11_20_YAC6P]
action = "PASS"
ay_lo = 11
ay_hi = 20
yac_lo = 6
yac_hi = 20
turnover = "NONE"

[DROPBACK_AY21P_YAC0_10]
action = "PASS"
ay_lo = 21
ay_hi = 35
yac_lo = 0
yac_hi = 10
turnover = "NONE"

[DROPBACK_AY21P_YAC11P]
action = "PASS"
ay_lo = 21
ay_hi = 35
yac_lo = 11
yac_hi = 30
turnover = "NONE"

# ── SCRAMBLE (2) ─────────────────────────────────────────────────────────

[SCRAMBLE_SHORT]
action = "PASS"
yards_lo = 0
yards_hi = 7
turnover = "NONE"

[SCRAMBLE_LONG]
action = "PASS"
yards_lo = 8
yards_hi = 25
turnover = "NONE"

# ── SPECIAL TEAMS (4) ────────────────────────────────────────────────────

[FG_MADE]
action = "FIELD_GOAL"
yards_lo = 0
yards_hi = 0
turnover = "NONE"

[FG_MISS]
action = "FIELD_GOAL"
yards_lo = 0
yards_hi = 0
turnover = "NONE"

[PUNT]
action = "PUNT"
yards_lo = 0
yards_hi = 0
turnover = "NONE"

[KNEEL]
action = "RUN"
yards_lo = -1
yards_hi = -1
turnover = "NONE"
