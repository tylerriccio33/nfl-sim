# =============================================================================
# ENGINE-ONLY COLUMN SELECTION
# =============================================================================
# Minimal subset of pbp_columns.toml required for the simulation engine.
# These columns are used by:
#   - _sampling.py: Filter matrix (down, ydstogo, yardline_100, wp)
#   - play.py: ingest_new_play() (yards_gained, desc, __EVENT_KEY)
#   - _event.py: Event detection (touchdown, interception, punt_*, field_goal_*, etc.)
#
# This reduced column set creates lighter-weight DataFrames for faster simulation.
# =============================================================================

# Columns for the Rust filter matrix (play matching/sampling)
[filter]
columns = [
    "down",
    "ydstogo",
    "yardline_100",
    "wp",
]

# Columns used by ingest_new_play() for play processing
[play_result]
columns = [
    "yards_gained",
    "desc",
    "kick_distance",
    "time_elapsed",  # Seconds consumed by this play (computed in data.py)
    "return_yards",  # For proportional return calculation
    "air_yards",     # For INT recovery point estimation
    "receiver_player_name",  # Display name for pass plays
    "rusher_player_name",    # Display name for rush plays
    # Note: yardline_100 is already in [filter] section
]

# Columns integral to the meta simulation engine
[meta]
columns = [
    "posteam",
    "defteam",
    "__EVENT_KEY",
]

# Depth chart position columns (added by DepthChartData.add_cols_to_pbp)
# These abstract players to their positional role (WR1, RB2, etc.)
[depth_chart]
columns = [
    "__receiver_dc_pos",
    "__receiver_dc_rank",
    "__rusher_dc_pos",
    "__rusher_dc_rank",
]
