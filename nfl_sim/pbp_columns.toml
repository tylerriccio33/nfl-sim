# Passing details (for proportional INT return calculation)
[passing]
columns = [
    "air_yards",             # For INT recovery point estimation
]

# Player IDs for depth chart integration
# These are joined with depth chart data to abstract plays by position (WR1, RB2, etc.)
[player_ids]
columns = [
    "receiver_player_id",    # gsis_id of receiver (for pass plays)
    "rusher_player_id",      # gsis_id of rusher (for run plays)
    "receiver_player_name",  # Display name of receiver (for pass plays)
    "rusher_player_name",    # Display name of rusher (for run plays)
]

