# =============================================================================
# PLAY-BY-PLAY COLUMN SELECTION
# =============================================================================
# Reference: dictionary/pbp.csv (374 total fields available)
#
# These columns are pulled from nflverse play-by-play data. Keeping this list
# minimal reduces memory usage and improves performance. Add columns as needed.
# =============================================================================

# Core identifiers and team info
[identifiers]
columns = [
    "play_id",
    "game_id",
    "posteam",      # Used for partitioning
    "defteam",      # Used for partitioning
    "home_team",
    "away_team",
    "season",
    "week",
    "game_date",
]

# Game situation columns (used for play matching/sampling)
[game_state]
columns = [
    "down",
    "ydstogo",
    "yardline_100",                 # Yards from opponent's endzone
    "wp",                           # Win probability
    "quarter_seconds_remaining",
    "half_seconds_remaining",
    "game_seconds_remaining",
    "qtr",
]
# Commented columns for future use:
# - goal_to_go
# - score_differential

# Play type and filtering columns
[play_type]
columns = [
    "play_type",
    "play",       # Binary: 1 if normal play
    "penalty",    # Binary: used to filter out penalty plays
]
# Commented columns for future use:
# - special
# - special_teams_play
# - qb_dropback
# - qb_kneel
# - qb_spike
# - qb_scramble

# Play outcome columns
[outcomes]
columns = [
    "yards_gained",
    "touchdown",
    "interception",
    "return_touchdown",    # For pick-sixes
    "fumble",
    "fumble_lost",
    "return_yards",        # For proportional return calculation
]
# Commented columns for future use:
# - safety
# - sack
# - complete_pass
# - incomplete_pass
# - first_down
# - third_down_converted
# - third_down_failed
# - fourth_down_converted
# - fourth_down_failed

# Field goal columns
[field_goal]
columns = [
    "field_goal_result",      # "made", "missed", "blocked"
    "field_goal_attempt",
    "kick_distance",
]
# Commented columns for future use:
# - extra_point_result
# - extra_point_attempt
# - two_point_conv_result
# - two_point_attempt

# Punt columns
[punt]
columns = [
    "punt_attempt",
    "punt_blocked",
    "punt_in_endzone",
]
# Commented columns for future use:
# - punt_inside_twenty
# - punt_out_of_bounds
# - punt_downed
# - punt_fair_catch
# - touchback

# Kickoff columns (for kickoff return sampling)
[kickoff]
columns = [
    "kickoff_attempt",
    "touchback",
    "kickoff_fair_catch",
    "kickoff_in_endzone",
]

# Play description (useful for debugging/display)
[description]
columns = [
    "desc",
]

# =============================================================================
# FUTURE COLUMN GROUPS (commented out for reference)
# =============================================================================

