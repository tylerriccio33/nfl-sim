# Action token taxonomy for the two-stage model architecture.
#
# Each action token maps to:
#   action - RUN | PASS | FIELD_GOAL | PUNT (maps to Action enum)
#   route  - RUN | PASS | ST (which sub-model handles the outcome)

[RUN]
action = "RUN"
route = "RUN"

[SCREEN]
action = "PASS"
route = "PASS"

[SHORT_PASS]
action = "PASS"
route = "PASS"

[MED_PASS]
action = "PASS"
route = "PASS"

[DEEP_PASS]
action = "PASS"
route = "PASS"

[SCRAMBLE]
action = "PASS"
route = "PASS"

[FG_ATT]
action = "FIELD_GOAL"
route = "ST"

[PUNT]
action = "PUNT"
route = "ST"

[KNEEL]
action = "RUN"
route = "ST"
