<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Game Simulator</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- htmx -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
        .htmx-request.htmx-indicator { display: inline-block; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div class="flex h-screen">
        <!-- Left Sidebar: Game List -->
        <aside id="sidebar" class="w-72 bg-gray-800 border-r border-gray-700 overflow-hidden flex-shrink-0 transition-all duration-300">
            <div id="sidebar-content" class="transition-opacity duration-300">
                <div class="p-4 border-b border-gray-700 flex items-center justify-between">
                    <div>
                        <h1 class="text-xl font-bold text-green-400">NFL Simulator</h1>
                        <p class="text-sm text-gray-400">Current Week Games</p>
                    </div>
                    <button onclick="toggleSidebar('left')" class="p-1 hover:bg-gray-700 rounded" title="Toggle sidebar">
                        <svg id="left-chevron" class="h-5 w-5 text-gray-400 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                    </button>
                </div>
                <div class="p-4 border-b border-gray-700">
                    <button
                        hx-get="/games"
                        hx-target="#game-list"
                        hx-indicator="#refresh-spinner"
                        class="text-sm text-blue-400 hover:text-blue-300 flex items-center gap-1">
                        <span id="refresh-spinner" class="htmx-indicator">
                            <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                            </svg>
                        </span>
                        Refresh Games
                    </button>
                </div>
                <div id="game-list">
                    {% block sidebar %}{% endblock %}
                </div>
            </div>
        </aside>
        <!-- Left sidebar expand button (visible when collapsed) -->
        <button id="left-expand-btn" onclick="toggleSidebar('left')" class="hidden bg-gray-800 border-r border-gray-700 p-2 hover:bg-gray-700 flex-shrink-0" title="Expand sidebar">
            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
        </button>

        <!-- Main Panel: Simulation Results -->
        <main id="main-panel" class="flex-1 overflow-y-auto p-6">
            {% block main %}
            <div class="text-center text-gray-500 mt-20">
                <div class="text-6xl mb-4">&#127944;</div>
                <p class="text-lg">Select a game to simulate</p>
                <p class="text-sm">Click on a matchup from the sidebar</p>
            </div>
            {% endblock %}
        </main>

        <!-- Right sidebar expand button (visible when collapsed) -->
        <button id="right-expand-btn" onclick="toggleSidebar('right')" class="hidden bg-gray-800 border-l border-gray-700 p-2 hover:bg-gray-700 flex-shrink-0" title="Expand sidebar">
            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
        </button>
        <!-- Right Panel: Statistics -->
        <aside id="stats-panel" class="w-80 bg-gray-800 border-l border-gray-700 overflow-hidden flex-shrink-0 transition-all duration-300">
            <div id="stats-content" class="p-4 transition-opacity duration-300">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-gray-300">Statistics</h2>
                    <button onclick="toggleSidebar('right')" class="p-1 hover:bg-gray-700 rounded" title="Toggle sidebar">
                        <svg id="right-chevron" class="h-5 w-5 text-gray-400 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                        </svg>
                    </button>
                </div>
                {% block stats %}
                <div class="text-gray-500 text-center mt-10">
                    <p>Statistics will appear here</p>
                </div>
                {% endblock %}
            </div>
        </aside>
    </div>
    <script>
        function toggleSidebar(side) {
            if (side === 'left') {
                const sidebar = document.getElementById('sidebar');
                const content = document.getElementById('sidebar-content');
                const expandBtn = document.getElementById('left-expand-btn');
                const chevron = document.getElementById('left-chevron');

                if (sidebar.classList.contains('w-72')) {
                    // Collapse
                    sidebar.classList.remove('w-72');
                    sidebar.classList.add('w-0');
                    content.classList.add('opacity-0', 'invisible');
                    expandBtn.classList.remove('hidden');
                    expandBtn.classList.add('flex');
                } else {
                    // Expand
                    sidebar.classList.remove('w-0');
                    sidebar.classList.add('w-72');
                    content.classList.remove('opacity-0', 'invisible');
                    expandBtn.classList.add('hidden');
                    expandBtn.classList.remove('flex');
                }
            } else {
                const statsPanel = document.getElementById('stats-panel');
                const content = document.getElementById('stats-content');
                const expandBtn = document.getElementById('right-expand-btn');
                const chevron = document.getElementById('right-chevron');

                if (statsPanel.classList.contains('w-80')) {
                    // Collapse
                    statsPanel.classList.remove('w-80');
                    statsPanel.classList.add('w-0');
                    content.classList.add('opacity-0', 'invisible');
                    expandBtn.classList.remove('hidden');
                    expandBtn.classList.add('flex');
                } else {
                    // Expand
                    statsPanel.classList.remove('w-0');
                    statsPanel.classList.add('w-80');
                    content.classList.remove('opacity-0', 'invisible');
                    expandBtn.classList.add('hidden');
                    expandBtn.classList.remove('flex');
                }
            }
        }
    </script>
</body>
</html>
