<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Game Simulator</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- htmx -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
        .htmx-request.htmx-indicator { display: inline-block; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div class="flex h-screen">
        <!-- Left Sidebar: Game List -->
        <aside id="sidebar" class="w-72 bg-gray-800 border-r border-gray-700 overflow-y-auto flex-shrink-0">
            <div class="p-4 border-b border-gray-700">
                <h1 class="text-xl font-bold text-green-400">NFL Simulator</h1>
                <p class="text-sm text-gray-400">Current Week Games</p>
                <button
                    hx-get="/games"
                    hx-target="#game-list"
                    hx-indicator="#refresh-spinner"
                    class="mt-2 text-sm text-blue-400 hover:text-blue-300 flex items-center gap-1">
                    <span id="refresh-spinner" class="htmx-indicator">
                        <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                        </svg>
                    </span>
                    Refresh Games
                </button>
            </div>
            <div id="game-list">
                {% block sidebar %}{% endblock %}
            </div>
        </aside>

        <!-- Main Panel: Simulation Results -->
        <main id="main-panel" class="flex-1 overflow-y-auto p-6">
            {% block main %}
            <div class="text-center text-gray-500 mt-20">
                <div class="text-6xl mb-4">&#127944;</div>
                <p class="text-lg">Select a game to simulate</p>
                <p class="text-sm">Click on a matchup from the sidebar</p>
            </div>
            {% endblock %}
        </main>

        <!-- Right Panel: Statistics -->
        <aside id="stats-panel" class="w-80 bg-gray-800 border-l border-gray-700 overflow-y-auto p-4 flex-shrink-0">
            {% block stats %}
            <div class="text-gray-500 text-center mt-10">
                <p>Statistics will appear here</p>
            </div>
            {% endblock %}
        </aside>
    </div>
</body>
</html>
