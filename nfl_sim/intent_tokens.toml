# Intent token taxonomy for the two-stage model architecture.
#
# Each intent token maps to:
#   intent - RUN | PASS | FIELD_GOAL | PUNT (maps to Intent enum)
#   route  - RUN | PASS | ST (which sub-model handles the outcome)

[RUN]
intent = "RUN"
route = "RUN"

[SCREEN]
intent = "PASS"
route = "PASS"

[PASS]
intent = "PASS"
route = "PASS"

[FG_ATT]
intent = "FIELD_GOAL"
route = "ST"

[PUNT]
intent = "PUNT"
route = "ST"

[KNEEL]
intent = "RUN"
route = "ST"
