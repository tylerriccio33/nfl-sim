# ── Intents ───────────────────────────────────────────────────────────
[intents.RUN]
value = 1
route = "RUN"

[intents.PASS]
value = 2
route = "PASS"

[intents.FIELD_GOAL]
value = 3
route = "ST"

[intents.PUNT]
value = 4
route = "ST"

# ── PBP play_type → Intent mapping (training data extraction) ────
[play_type_map]
run        = "RUN"
pass       = "PASS"
qb_kneel   = "RUN"
punt       = "PUNT"
field_goal = "FIELD_GOAL"

# ── Models ───────────────────────────────────────────────────────────
# Each model declares: artifact location, input features, output outcomes

[models.intent]
artifact = "training/artifacts/rf/intent"
metadata = "meta.json"  # relative to artifact dir
compiled = "model.tl"   # relative to artifact dir
features = ["down", "dist", "yardline", "score_diff", "quarter", "clock", "goal_to_go", "spread", "epa"]
outcomes = ["intent"]

[models.run]
artifact = "training/artifacts/cvae/run"
features = ["down", "dist", "yardline", "score_diff", "quarter", "clock", "goal_to_go", "spread", "epa"]
outcomes = ["yards_gained", "turnover_type", "completion"]
# CVAE hyperparameters
latent_dim    = 16
hidden_dim    = 64
cat_emb_dim   = 8
beta          = 1.0
epochs        = 100
batch_size    = 256
learning_rate = 1e-3

[models.pass]
artifact = "training/artifacts/cvae/pass"
features = ["down", "dist", "yardline", "score_diff", "quarter", "clock", "goal_to_go", "spread", "epa"]
outcomes = ["yards_gained", "turnover_type", "completion"]
# CVAE hyperparameters
latent_dim    = 16
hidden_dim    = 64
cat_emb_dim   = 8
beta          = 1.0
epochs        = 100
batch_size    = 256
learning_rate = 1e-3

[models.punt]
artifact = "training/artifacts/punt/yards.joblib"
features = ["down", "dist", "yardline", "score_diff", "quarter", "clock", "goal_to_go", "spread", "epa"]
outcomes = ["yards_gained"]

[models.time]
artifact = "training/artifacts/time/model.json"
features = ["down", "dist", "yardline", "score_diff", "quarter", "clock", "goal_to_go", "spread", "epa", "yards_gained", "completion"]
outcomes = ["time_elapsed"]

# ST plays use a fixed time override (no model needed)
[st.time_override]
value = 20

# ── Training Data ─────────────────────────────────────────────────────
[training]
pbp_path      = "data/pbp.parquet"
schedule_path = "data/schedules.parquet"
eval_split    = 0.1
quarters      = [1, 2, 3, 4]
