# ── Features ──────────────────────────────────────────────────────
# Order here IS the feature vector order. Do not reorder without retraining.
[features]
state = ["down", "dist", "yardline", "score_diff", "quarter", "clock", "goal_to_go"]
game  = ["spread", "epa"]

# ── Intents ───────────────────────────────────────────────────────
[intents.RUN]
value = 1
route = "RUN"

[intents.PASS]
value = 2
route = "PASS"

[intents.FIELD_GOAL]
value = 3
route = "ST"

[intents.PUNT]
value = 4
route = "ST"

# ── PBP play_type → Intent mapping (training data extraction) ────
[play_type_map]
run        = "RUN"
pass       = "PASS"
qb_kneel   = "RUN"
punt       = "PUNT"
field_goal = "FIELD_GOAL"

# ── Outcome fields ────────────────────────────────────────────────
# Defines every field on Outcome and how it's sourced.

[outcome.yards]
kind       = "continuous"
default    = 0
pbp_column = "yards_gained"

[outcome.turnover_type]
kind    = "categorical"
classes = ["NONE", "INTERCEPTION", "FUMBLE"]
default = "NONE"
# Derived from two columns via custom logic in prepare.py
pbp_columns = ["interception", "fumble_lost"]

[outcome.completion]
kind          = "boolean"
default       = true
pbp_column    = "complete_pass"
pbp_fill_null = 0

[outcome.touchdown]
kind    = "boolean"
default = false
source  = "engine"  # detected by state machine, not model-predicted

[outcome.time_elapsed]
kind    = "continuous"
default = 0
source  = "time_model"  # predicted by dedicated time model

# ── Routes (Outcome Sub-Models) ──────────────────────────────────

[routes.RUN]
model_type          = "cvae"
artifact_dir        = "training/artifacts/cvae/run"
continuous_outputs  = ["yards"]
categorical_outputs = ["turnover_type"]

[routes.PASS]
model_type          = "cvae"
artifact_dir        = "training/artifacts/cvae/pass"
continuous_outputs  = ["yards"]
categorical_outputs = ["turnover_type", "completion"]

[routes.ST]
model_type = "dispatch"  # dispatches to sub-models based on intent

[routes.ST.FIELD_GOAL]
model_type    = "sklearn"
artifact_path = "training/artifacts/fg/model.joblib"
target        = "fg_success"

[routes.ST.PUNT.blocked]
model_type    = "sklearn"
artifact_path = "training/artifacts/punt/blocked.joblib"
target        = "punt_blocked"

[routes.ST.PUNT.yards]
model_type    = "sklearn"
artifact_path = "training/artifacts/punt/yards.joblib"
target        = "yards"

[routes.ST.time_override]
value = 20

# ── Intent Model ──────────────────────────────────────────────────
[intent_model]
artifact_dir      = "training/artifacts/rf/intent"
compiled_artifact = "model.tl"
meta_artifact     = "meta.json"

# ── Time Model ────────────────────────────────────────────────────
[time_model]
artifact_dir  = "training/artifacts/time"
artifact_file = "model.joblib"

# Outcome fields appended as extra features after the base features.
# Order here IS the appended feature order.
conditioning = ["yards", "completion"]

# Defaults when a conditioning field isn't available (e.g., ST plays)
[time_model.conditioning_defaults]
yards      = 0
completion = 1

# ── CVAE Defaults ─────────────────────────────────────────────────
[cvae_defaults]
latent_dim    = 16
hidden_dim    = 64
cat_emb_dim   = 8
beta          = 1.0
epochs        = 100
batch_size    = 256
learning_rate = 1e-3

# ── Training Data ─────────────────────────────────────────────────
[training]
pbp_path      = "data/pbp.parquet"
schedule_path = "data/schedules.parquet"
eval_split    = 0.1
quarters      = [1, 2, 3, 4]
