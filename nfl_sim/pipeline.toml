# ── Intents ───────────────────────────────────────────────────────────
[intents.RUN]
value = 1
route = "RUN"

[intents.PASS]
value = 2
route = "PASS"

[intents.FIELD_GOAL]
value = 3
route = "ST"

[intents.PUNT]
value = 4
route = "ST"

# ── PBP play_type → Intent mapping (training data extraction) ────
[play_type_map]
run = "RUN"
pass = "PASS"
qb_kneel = "RUN"
punt = "PUNT"
field_goal = "FIELD_GOAL"

# ── Models ───────────────────────────────────────────────────────────
# Each model declares: artifact location, input features, output outcomes

[models.intent]
artifact = "training/artifacts/rf/intent"
metadata = "meta.json" # relative to artifact dir
compiled = "model.tl" # relative to artifact dir
features = [
    "down",
    "ydstogo",
    "yardline_100",
    "score_diff",
    "qtr",
    "game_seconds_remaining",
    "goal_to_go",
    "spread_line",
    "season_epa",
]
outcomes = ["intent"]

[models.gbm_run]
artifact = "training/artifacts/gbm/run"
proxy_target = "epa"
features = [
    "down",
    "ydstogo",
    "yardline_100",
    "score_diff",
    "qtr",
    "game_seconds_remaining",
    "goal_to_go",
    "spread_line",
    "season_epa",
]
index_outcomes = ["yards_gained", "turnover_type", "complete_pass"]
index_file = "index.npz"

[models.gbm_pass]
artifact = "training/artifacts/gbm/pass"
proxy_target = "epa"
features = [
    "down",
    "ydstogo",
    "yardline_100",
    "score_diff",
    "qtr",
    "game_seconds_remaining",
    "goal_to_go",
    "spread_line",
    "season_epa",
]
index_outcomes = ["yards_gained", "turnover_type", "complete_pass"]
index_file = "index.npz"

# ── GBM Training & Inference ────────────────────────────────────────
[gbm]
# LightGBM hyperparameters (proxy task: predict epa)
n_estimators = 100
max_depth = 6
min_child_samples = 50
learning_rate = 0.05
random_state = 42

# Proximity sampling: how many top-overlap plays to sample from
top_k = 50

[models.punt]
artifact = "training/artifacts/punt/yards.joblib"
features = ["yardline_100"]
outcomes = ["kick_distance"]

[models.time]
artifact = "training/artifacts/time/model.tl"
features = ["yards_gained", "complete_pass", "pass_attempt", "rush_attempt"]
outcomes = ["time_elapsed"]

# ST plays use a fixed time override (no model needed)
[st.time_override]
value = 20

# ── Outcome ──────────────────────────────────────────────────────────
# Defines the Outcome dataclass fields. Run `make generate-outcome` to regenerate.
# Fields without a default come first; fields with a default come after.

[outcome.yards_gained]
type = "int"

[outcome.turnover_type]
type = "TurnoverType"

[outcome.touchdown]
type = "bool"

[outcome.time_elapsed]
type = "int"

[outcome.complete_pass]
type = "bool"
default = false

[outcome.pass_attempt]
type = "bool"
default = false

[outcome.rush_attempt]
type = "bool"
default = false

# ── Training Data ─────────────────────────────────────────────────────
[training]
pbp_path = "data/pbp.parquet"
schedule_path = "data/schedules.parquet"
eval_split = 0.1
quarters = [1, 2, 3, 4]
