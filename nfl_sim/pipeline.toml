# ── Feature Reference ─────────────────────────────────────────
# These lists document the structure of features used throughout the system.
# GameState-only features (7 total)
state_features = ["down", "dist", "yardline", "score_diff", "quarter", "clock", "goal_to_go"]
# GameContext features (2 total)
game_features = ["spread", "epa"]

# ── Intents ───────────────────────────────────────────────────────
[intents.RUN]
value = 1
route = "RUN"

[intents.PASS]
value = 2
route = "PASS"

[intents.FIELD_GOAL]
value = 3
route = "ST"

[intents.PUNT]
value = 4
route = "ST"

# ── PBP play_type → Intent mapping (training data extraction) ────
[play_type_map]
run        = "RUN"
pass       = "PASS"
qb_kneel   = "RUN"
punt       = "PUNT"
field_goal = "FIELD_GOAL"

# ── Intent Model ──────────────────────────────────────────────────────
[intent_model]
artifact_dir      = "training/artifacts/rf/intent"
compiled_artifact = "model.tl"
meta_artifact     = "meta.json"

# Input features (from GameState + GameContext)
features = ["down", "dist", "yardline", "score_diff", "quarter", "clock", "goal_to_go", "spread", "epa"]
outcomes = ["intent"]

# ── Outcome Sub-Models ────────────────────────────────────────────────
# Each model declares its input features and output outcomes.

[routes.RUN]
description = "CVAE for RUN plays"
model_type  = "cvae"
artifact_dir = "training/artifacts/cvae/run"

# Input features from GameState + GameContext
features = ["down", "dist", "yardline", "score_diff", "quarter", "clock", "goal_to_go", "spread", "epa"]

# Output outcomes produced by this model
outcomes = ["yards_gained", "turnover_type", "completion"]

[routes.PASS]
description = "CVAE for PASS plays"
model_type  = "cvae"
artifact_dir = "training/artifacts/cvae/pass"

# Input features from GameState + GameContext
features = ["down", "dist", "yardline", "score_diff", "quarter", "clock", "goal_to_go", "spread", "epa"]

# Output outcomes produced by this model
outcomes = ["yards_gained", "turnover_type", "completion"]

[routes.ST]
description = "Special teams dispatcher (punt/field goal)"
model_type  = "dispatch"  # routes to sub-models based on intent

[routes.ST.PUNT]
description = "Decision tree for punt yards"
model_type  = "sklearn"
artifact_path = "training/artifacts/punt/yards.joblib"
target = "yards"

# Blocked probability (0.05%) is hardcoded in outcomes.py, no model needed
features = ["down", "dist", "yardline", "score_diff", "quarter", "clock", "goal_to_go", "spread", "epa"]
outcomes = ["yards_gained"]

# ST plays use a fixed time override
[routes.ST.time_override]
value = 20

# ── Time Model ────────────────────────────────────────────────────────
[time_model]
description = "LinearRegression for time_elapsed given state + outcome"
artifact_dir  = "training/artifacts/time"
artifact_file = "model.json"

# Base features from game state and context
base_features = ["down", "dist", "yardline", "score_diff", "quarter", "clock", "goal_to_go", "spread", "epa"]

# Features from prior outcome models (appended after play is generated)
outcome_conditioning = ["yards_gained", "completion"]

# Full feature list (base + outcome conditioning, in order)
features = ["down", "dist", "yardline", "score_diff", "quarter", "clock", "goal_to_go", "spread", "epa", "yards_gained", "completion"]

# Output: time_elapsed
outcomes = ["time_elapsed"]

# ── Outcome Field Reference ───────────────────────────────────────────
# Each possible outcome field with its type, default, and data source.
# This documents the contract for the Outcome dataclass.

[outcome_fields.yards_gained]
kind       = "continuous"
default    = 0
pbp_column = "yards_gained"
source     = "model"

[outcome_fields.turnover_type]
kind       = "categorical"
classes    = ["NONE", "INTERCEPTION", "FUMBLE"]
default    = "NONE"
pbp_columns = ["interception", "fumble_lost"]
source     = "model"

[outcome_fields.completion]
kind          = "boolean"
default       = true
pbp_column    = "complete_pass"
pbp_fill_null = 0
source        = "model"

[outcome_fields.touchdown]
kind   = "boolean"
default = false
source = "engine"

[outcome_fields.time_elapsed]
kind   = "continuous"
default = 0
source = "time_model"

# ── CVAE Defaults ─────────────────────────────────────────────────────
[cvae_defaults]
latent_dim    = 16
hidden_dim    = 64
cat_emb_dim   = 8
beta          = 1.0
epochs        = 100
batch_size    = 256
learning_rate = 1e-3

# ── Training Data ─────────────────────────────────────────────────────
[training]
pbp_path      = "data/pbp.parquet"
schedule_path = "data/schedules.parquet"
eval_split    = 0.1
quarters      = [1, 2, 3, 4]
