[project]
name = "nfl-sim"
version = "0.1.0"
authors = [
    { name = "Tyler Riccio", email = "tylerriccio8@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.0.0",
    "polars>=1.36.1",
    "rich>=14.2.0",
]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
python-packages = ["nfl_sim"]
module-name = "nfl_sim_core"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    "complexipy>=5.1.0",
    "hypothesis>=6.100.0",
    "line-profiler>=4.1.0",
    "maturin>=1.7,<2.0",
    "nflreadpy>=0.1.5",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "requests>=2.32.5",
    "ruff>=0.14.10",
    "ty>=0.0.8",
]
