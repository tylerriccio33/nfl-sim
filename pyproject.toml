[project]
name = "nfl-sim"
version = "0.1.0"
authors = [
    { name = "Tyler Riccio", email = "tylerriccio8@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.0.0",
    "polars>=1.36.1",
    "rich>=14.2.0",
]
[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "complexipy>=5.1.0",
    "hypothesis>=6.100.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
    "ty>=0.0.8",
]
