[package]
name = "sim_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "sim_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }
numpy = "0.22"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rand = "0.8"
rand_xoshiro = "0.6"
rustc-hash = "2"
anyhow = "1"
# arrow/parquet stay optional for now — we accept pre-gathered arrays from Python
# and defer loading parquet inside Rust until we need a standalone online API.
